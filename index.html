<!DOCTYPE html>
<html>

<head>
    <script src="aframe.min.js"></script>
    <script src="aframe-extras.min.js"></script>
    <script src="zappar-aframe/zappar-aframe.js"></script>

    <meta charset="utf-8" />
    <!-- Мета-теги для корректной работы на телефонах -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>AR примерка очков</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* чтобы не было прокрутки при жестах на телефоне */
            background: #000; /* чёрный фон вокруг видео */
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            overscroll-behavior: none;
        }

        /* Кнопка открытия выбора очков */
        #openGlassesPickerBtn {
            position: absolute;
            z-index: 11;
            top: 10px;
            left: 10px;
            padding: 8px 12px;
            font-size: 14px;
        }

        /* Модальное окно выбора очков */
        #glasses-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #glasses-modal {
            background: #111827;
            color: #f9fafb;
            padding: 16px;
            border-radius: 10px;
            max-width: 90vw;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        #glasses-modal h2 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        #glasses-modal p {
            margin: 0 0 12px;
            font-size: 13px;
            opacity: 0.9;
        }

        #glasses-modal .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        #glasses-modal button {
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        #glasses-modal button.model-btn {
            background: #ffffff;
            color: #111827;
        }

        #glasses-modal button.model-btn.active {
            background: #3b82f6;
            color: #ffffff;
        }

        #glasses-modal button.close-btn {
            background: #4b5563;
            color: #e5e7eb;
            width: 100%;
        }
    </style>
</head>

<body>
    <!-- Кнопка переключения камеры -->
    <button id="toggleCameraBtn" style="position: absolute; z-index: 10; top: 10px; right: 10px; padding: 8px 12px; font-size: 14px;">
        Включить заднюю камеру
    </button>

    <!-- Кнопка открытия модального окна выбора очков -->
    <button id="openGlassesPickerBtn">
        Выбрать очки
    </button>

    <!-- Модальное окно выбора модели очков -->
    <div id="glasses-modal-overlay">
        <div id="glasses-modal">
            <h2>Выбор очков</h2>
            <p>Нажми на модель, чтобы примерить её. Файлы .glb должны лежать в папке <code>assets</code>.</p>
            <div class="buttons">
                <!-- Задай здесь свои реальные файлы .glb -->
                <button class="model-btn active" data-model="assets/glasses1.glb">Модель 1</button>
                <button class="model-btn" data-model="assets/glasses2.glb">Модель 2</button>
                <button class="model-btn" data-model="assets/glasses3.glb">Модель 3</button>
            </div>
            <button class="close-btn" id="closeGlassesModalBtn">Закрыть</button>
        </div>
    </div>

    <a-scene
        zappar-scene
        embedded
        renderer="antialias: true; precision: high; highRefreshRate: true;"
        vr-mode-ui="enabled: false"
        style="width: 100vw; height: 100vh;">
        <!-- Предзагрузка моделей очков -->
        <a-assets>
            <!-- Здесь укажи реальные glb, которые положишь в assets/ -->
            <a-asset-item id="glasses1" src="assets/glasses1.glb"></a-asset-item>
            <a-asset-item id="glasses2" src="assets/glasses2.glb"></a-asset-item>
            <a-asset-item id="glasses3" src="assets/glasses3.glb"></a-asset-item>
        </a-assets>
        <!-- Ask user for camera permissions, display some text if permission is denied -->
        <a-entity zappar-permissions-ui id="permissions"></a-entity>
        <!-- shows a full-page dialog that informs the user they're using an unsupported browser -->
        <a-entity zappar-compatibility-ui id="compatibility"></a-entity>

        <!-- По умолчанию селфи-камера для отслеживания лица -->
        <a-camera id="zapparCamera" zappar-camera="user-facing: true;" />

        <!-- Трекер лица -->
        <a-entity zappar-face id="my-face-tracker">

            <!-- Маска головы, чтобы голова не «лезла» сквозь 3D -->
            <a-entity zappar-head-mask="face:#my-face-tracker;"></a-entity>

            <!-- Очки, привязанные к лицу -->
            <!-- Положение и масштаб подбери под свои модели (через devtools или подбором чисел) -->
            <a-entity id="glassesModel"
                      gltf-model="#glasses1"
                      position="0 0 0.1"
                      rotation="0 0 0"
                      scale="0.8 0.8 0.8">
            </a-entity>

        </a-entity>
    </a-scene>

    <script>
        (function () {
            // Переключение селфи / задней камеры
            var btn = document.getElementById('toggleCameraBtn');
            var cam = document.getElementById('zapparCamera');
            if (btn && cam) {
                var isUserFacing = true; // по умолчанию селфи-камера

                function updateButtonText() {
                    btn.textContent = isUserFacing ? 'Включить заднюю камеру' : 'Включить селфи-камеру';
                }

                updateButtonText();

                btn.addEventListener('click', function () {
                    isUserFacing = !isUserFacing;
                    var attr = 'user-facing: ' + (isUserFacing ? 'true' : 'false') + ';';
                    cam.setAttribute('zappar-camera', attr);
                    updateButtonText();
                });
            }

            // Переключение моделей очков через модальное окно
            var glassesEntity = document.getElementById('glassesModel');
            var modelButtons = document.querySelectorAll('#glasses-modal .model-btn');

            var openGlassesBtn = document.getElementById('openGlassesPickerBtn');
            var closeGlassesBtn = document.getElementById('closeGlassesModalBtn');
            var overlay = document.getElementById('glasses-modal-overlay');

            if (glassesEntity && modelButtons.length) {
                modelButtons.forEach(function (button) {
                    button.addEventListener('click', function () {
                        var url = button.getAttribute('data-model');
                        if (!url) return;

                        // Снимаем активный класс со всех кнопок
                        modelButtons.forEach(function (b) { b.classList.remove('active'); });
                        button.classList.add('active');

                        // Меняем модель очков
                        glassesEntity.setAttribute('gltf-model', 'url(' + url + ')');
                    });
                });
            }

            // Открытие / закрытие модального окна
            if (overlay && openGlassesBtn && closeGlassesBtn) {
                openGlassesBtn.addEventListener('click', function () {
                    overlay.style.display = 'flex';
                });

                closeGlassesBtn.addEventListener('click', function () {
                    overlay.style.display = 'none';
                });

                // Клик по фону закрывает модалку
                overlay.addEventListener('click', function (e) {
                    if (e.target === overlay) {
                        overlay.style.display = 'none';
                    }
                });
            }
        })();
    </script>
</body>

</html>
